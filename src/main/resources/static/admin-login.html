<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrator sign in · CollegeWise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar"><div class="container"><a class="navbar-brand" href="/">CollegeWise<span>.</span></a><a href="/" class="btn btn-outline-dark btn-sm">Public site</a></div></nav>
  <main class="container py-5" style="max-width: 34rem">
    <p class="eyebrow">ADMINISTRATION</p>
    <h1>Administrator sign in</h1>
    <p class="text-secondary">Use the administrator account configured for this application.</p>
    <form id="adminLoginForm" class="card border-0 p-4 mt-4">
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <p id="adminLoginMessage" class="small" role="status" aria-live="polite"></p>
      <button id="adminLoginSubmit" class="btn btn-primary" type="submit">Sign in to admin</button>
    </form>
  </main>
  <script src="/admin-login.js"></script>
</body>
</html>
