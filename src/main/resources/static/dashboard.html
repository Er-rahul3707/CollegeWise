<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student dashboard · CollegeWise</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/styles.css" rel="stylesheet"></head><body><nav class="navbar"><div class="container"><a class="navbar-brand" href="/">CollegeWise<span>.</span></a><div class="d-flex gap-2"><a href="/" class="btn btn-outline-dark btn-sm">Explore colleges</a><button id="logout" class="btn btn-outline-danger btn-sm">Sign out</button></div></div></nav><main class="container py-5"><p class="eyebrow">YOUR COLLEGEWISE</p><h1 class="mb-2">Student dashboard</h1><p id="message" class="text-secondary">Loading your profile…</p><div id="app" class="d-none"><div class="row g-4 mt-2"><div class="col-lg-5"><section class="card border-0 p-4"><h2 class="h4">Your profile</h2><form id="profileForm" class="row g-2"><div class="col-6"><label class="form-label small">10th %</label><input class="form-control" name="tenthPercentage" type="number" min="0" max="100" step=".01"></div><div class="col-6"><label class="form-label small">12th %</label><input class="form-control" name="twelfthPercentage" type="number" min="0" max="100" step=".01"></div><div class="col-6"><label class="form-label small">Exam</label><input class="form-control" name="entranceExam" placeholder="JEE Main"></div><div class="col-6"><label class="form-label small">Exam year</label><input class="form-control" name="examYear" type="number"></div><div class="col-6"><label class="form-label small">Rank</label><input class="form-control" name="rank" type="number" min="1"></div><div class="col-6"><label class="form-label small">Percentile</label><input class="form-control" name="percentile" type="number" min="0" max="100" step=".01"></div><div class="col-6"><label class="form-label small">Category</label><input class="form-control" name="category" placeholder="OPEN"></div><div class="col-6"><label class="form-label small">Course</label><input class="form-control" name="preferredCourse" placeholder="B.Tech"></div><div class="col-6"><label class="form-label small">Branch</label><input class="form-control" name="preferredBranch"></div><div class="col-6"><label class="form-label small">Maximum fees</label><input class="form-control" name="maximumBudget" type="number" min="0"></div><div class="col-6"><label class="form-label small">State</label><input class="form-control" name="preferredState"></div><div class="col-6"><label class="form-label small">City</label><input class="form-control" name="preferredCity"></div><div class="col-12"><label class="form-label small">Career interest</label><input class="form-control" name="careerInterest" placeholder="Data science, design, business…"></div><div class="col-12 form-check ms-2 mt-3"><input class="form-check-input" name="hostelRequired" type="checkbox"><label class="form-check-label">I need hostel accommodation</label></div><div class="col-12 mt-3"><button class="btn btn-primary">Save profile</button></div></form><p id="profileMessage" class="small mt-2"></p></section><section class="card border-0 p-4 mt-4"><h2 class="h5">Career guidance</h2><p id="career" class="text-secondary mb-0"></p></section></div><div class="col-lg-7"><section class="mb-4"><div class="d-flex justify-content-between align-items-center"><h2 class="h4">Your matches</h2><button id="refresh" class="btn btn-outline-dark btn-sm">Refresh</button></div><div id="recommendations" class="row g-3 mt-1"></div></section><section><h2 class="h4">Saved colleges</h2><div id="favorites" class="row g-3"></div></section><section class="mt-4"><h2 class="h4">Recommendation history</h2><div id="history" class="row g-3"><p class="text-secondary">Loading history…</p></div></section><section class="mt-4"><h2 class="h5">Compare colleges</h2><p class="small text-secondary">Enter 2 or 3 college IDs separated by commas.</p><div class="d-flex gap-2"><input class="form-control" id="compareIds" placeholder="1, 2" aria-label="College IDs to compare"><button id="compare" class="btn btn-dark">Compare</button></div><div id="comparison" class="table-responsive mt-3"></div></section></div></div></div></main><script src="/dashboard.js"></script></body></html>
